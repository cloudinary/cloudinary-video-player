<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-7 media spike</title>
  <style>
    body { margin: 0; background: #fff; font-family: system-ui, sans-serif; }
    .page-slot { width: 640px; max-width: 100%; }
    video-skin { display: block; width: 100%; aspect-ratio: 16 / 9; }

    /* Measured with and without: the skin's ::slotted(video) rule does not reach a <video> slotted into <hlsjs-video>. */
    body.fill-fix video-skin > hlsjs-video > video[slot="media"] {
      display: block; width: 100%; height: 100%; object-fit: contain;
    }

    /* Overlay layer: above the media and poster, below the control bar (z-index 30) and dialogs (40-50). */
    cld-overlay-layer { position: absolute; inset: 0; z-index: 25; display: block; pointer-events: none; }
    .cld-overlay { pointer-events: auto; color: #fff; background: rgb(0 0 0 / 0.75); }
    .cld-overlay[hidden] { display: none; }
    .cld-overlay--full { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; }
    .cld-overlay--corner { position: absolute; right: 12px; top: 12px; padding: 8px 12px; border-radius: 6px; }

    .touch-container { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; }
    .touch-slider { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 32px; display: block; }
    .touch-slider media-slider-track { display: block; height: 4px; margin-top: 14px; background: #888; }
  </style>
</head>
<body>
  <div class="page-slot">
    <video id="my-video" class="cld-video-player cld-fluid my-class" data-cld-public-id="sea_turtle" data-test="keep-me"
      muted playsinline crossorigin="anonymous" preload="metadata"></video>
  </div>
  <div id="touch-root"></div>
  <script type="module" src="./page.js"></script>
</body>
</html>
